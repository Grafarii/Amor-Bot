name: Deploy NeuroQuest to GitHub Pages

on:
  push:
    branches: [main, cursor/neuro-quest-game-822e]
    paths:
      - 'neuro-quest/**'
      - '.github/workflows/deploy-neuro-quest.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: neuro-quest

      - uses: actions/deploy-pages@v4
        id: deployment
