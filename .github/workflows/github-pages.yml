name: GitHub Pages (Actions)

on:
  push:
    branches: [main]
    paths:
      - 'neuro-quest/**'
      - 'psico-social-quest/**'
      - 'matriz-quest/**'
      - 'processo-quest/**'
      - 'site/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/neuro-quest _site/psico-social-quest _site/matriz-quest _site/processo-quest
          cp -r neuro-quest/. _site/neuro-quest/
          cp -r psico-social-quest/. _site/psico-social-quest/
          cp -r matriz-quest/. _site/matriz-quest/
          cp -r processo-quest/. _site/processo-quest/
          cp site/index.html _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
