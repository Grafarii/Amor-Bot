name: Deploy NeuroQuest (gh-pages branch)

on:
  push:
    branches: [main, cursor/neuro-quest-game-822e]
    paths:
      - 'neuro-quest/**'
      - '.github/workflows/deploy-neuro-quest-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r neuro-quest/. _site/
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
