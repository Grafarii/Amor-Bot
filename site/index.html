<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0a08">
  <title>Jogos — 2º Semestre Psicologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { max-width: 480px; width: 100%; text-align: center; }
    h1 { font-size: 1.75rem; margin-bottom: 8px; }
    p { color: #94a3b8; margin-bottom: 32px; line-height: 1.5; }
    .games { display: flex; flex-direction: column; gap: 16px; }
    a.game {
      display: block;
      padding: 24px;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      border: 2px solid rgba(255,255,255,0.1);
      transition: transform 0.2s, border-color 0.2s;
    }
    a.game:hover { transform: translateY(-2px); }
    .neuro { background: linear-gradient(135deg, #1a1040, #141b2d); border-color: rgba(124,58,237,0.4); }
    .neuro:hover { border-color: #7c3aed; }
    .socio { background: linear-gradient(135deg, #1a1008, #1a1410); border-color: rgba(249,115,22,0.4); }
    .socio:hover { border-color: #f97316; }
    .icon { font-size: 3rem; margin-bottom: 8px; }
    .title { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .desc { font-size: 0.9rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 2º Semestre — Psicologia</h1>
    <p>Escolha o jogo para estudar — links permanentes</p>
    <div class="games">
      <a class="game neuro" href="./neuro-quest/">
        <div class="icon">🧠</div>
        <div class="title">NeuroQuest</div>
        <div class="desc">Neurociências e Neuropsicologia</div>
      </a>
      <a class="game socio" href="./psico-social-quest/">
        <div class="icon">👥</div>
        <div class="title">SocioQuest</div>
        <div class="desc">Psicologia Social</div>
      </a>
    </div>
  </div>
</body>
</html>
